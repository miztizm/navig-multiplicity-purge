name: lint

on:
  push:
  pull_request:

jobs:
  batch-hygiene:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Batch file must be ASCII-only with CRLF line endings
        shell: pwsh
        run: |
          $path = 'purge-multiplicity.bat'
          if (-not (Test-Path $path)) { throw "$path is missing" }
          $bytes = [System.IO.File]::ReadAllBytes($path)

          $nonAscii = 0
          foreach ($b in $bytes) { if ($b -gt 127) { $nonAscii++ } }
          if ($nonAscii -gt 0) { throw "non-ASCII bytes found: $nonAscii (cmd.exe will mis-render them)" }

          $lf = 0
          $crlf = 0
          for ($i = 0; $i -lt $bytes.Length; $i++) {
            if ($bytes[$i] -eq 10) {
              $lf++
              if ($i -gt 0 -and $bytes[$i - 1] -eq 13) { $crlf++ }
            }
          }
          if ($lf -ne $crlf) { throw "LF-only line endings detected: $($lf - $crlf) line(s). Use CRLF." }
          if ($lf -lt 100) { throw "file looks truncated: only $lf lines" }

          Write-Host "OK: $lf lines, all CRLF, ASCII only."

      - name: Every mutating helper must carry the dry-run guard
        shell: pwsh
        run: |
          $lines = Get-Content 'purge-multiplicity.bat'
          $helpers = @(':StopService', ':DelService', ':KillProc', ':RunUninstaller',
                       ':RmDir', ':DelFile', ':DelMask', ':RegDel',
                       ':DelTasksMatching', ':DelFirewall')
          $fail = 0
          foreach ($h in $helpers) {
            $start = ($lines | Select-String -SimpleMatch $h | Select-Object -Last 1).LineNumber
            if (-not $start) { Write-Host "missing helper $h"; $fail++; continue }
            $body = $lines[($start)..([Math]::Min($start + 12, $lines.Count - 1))] -join "`n"
            if ($body -notmatch '\$?%DRY%') {
              Write-Host "helper $h has no dry-run guard"
              $fail++
            }
          }
          if ($fail -gt 0) { throw "$fail helper(s) are missing the %DRY% guard" }
          Write-Host "OK: all mutating helpers are guarded."

      - name: NAVIG skill packaging (frontmatter, YAML, payload sync)
        shell: pwsh
        run: |
          python -m pip install --quiet pyyaml
          python navig-skill/test_skill.py
